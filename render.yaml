databases:
  - name: food-order-db
    databaseName: food_order
    user: food_order_user
    plan: free

services:
  - type: web
    name: food-order-app
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run render:build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: food-order-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
